<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="780" viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1100" height="780" fill="#F8FAFC" rx="12"/>
  <text x="550" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E3A5F">Online Examination System — Class &amp; Module Diagram</text>

  <!-- ══ AuthController ══════════════════════════════════ -->
  <rect x="30" y="60" width="240" height="156" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="30" y="60" width="240" height="32" rx="8" fill="#2563EB"/>
  <rect x="30" y="82" width="240" height="10" fill="#2563EB"/>
  <text x="150" y="81" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«controller»</text>
  <text x="150" y="104" text-anchor="middle" fill="#1E3A5F" font-size="12" font-weight="bold">AuthController</text>
  <line x1="30" y1="115" x2="270" y2="115" stroke="#93C5FD" stroke-width="1"/>
  <text x="40" y="132" fill="#374151" font-size="11">+ studentRegister(req, res): void</text>
  <text x="40" y="150" fill="#374151" font-size="11">+ studentLogin(req, res): JWT</text>
  <text x="40" y="168" fill="#374151" font-size="11">+ teacherLogin(req, res): JWT</text>
  <text x="40" y="188" fill="#374151" font-size="11">- signToken(payload): string</text>
  <text x="40" y="206" fill="#374151" font-size="11">- isValidEmail(email): boolean</text>

  <!-- ══ QuestionController ══════════════════════════════ -->
  <rect x="30" y="250" width="240" height="176" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <rect x="30" y="250" width="240" height="32" rx="8" fill="#D97706"/>
  <rect x="30" y="272" width="240" height="10" fill="#D97706"/>
  <text x="150" y="271" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«controller»</text>
  <text x="150" y="294" text-anchor="middle" fill="#92400E" font-size="12" font-weight="bold">QuestionController</text>
  <line x1="30" y1="305" x2="270" y2="305" stroke="#FCD34D" stroke-width="1"/>
  <text x="40" y="322" fill="#374151" font-size="11">+ getAllQuestions(req, res): void</text>
  <text x="40" y="340" fill="#374151" font-size="11">+ getQuestion(req, res): void</text>
  <text x="40" y="358" fill="#374151" font-size="11">+ createQuestion(req, res): void</text>
  <text x="40" y="376" fill="#374151" font-size="11">+ updateQuestion(req, res): void</text>
  <text x="40" y="394" fill="#374151" font-size="11">+ deleteQuestion(req, res): void</text>
  <text x="40" y="412" fill="#374151" font-size="11">- validatePayload(body): boolean</text>

  <!-- ══ AuthMiddleware ══════════════════════════════════ -->
  <rect x="30" y="460" width="240" height="136" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="30" y="460" width="240" height="32" rx="8" fill="#7C3AED"/>
  <rect x="30" y="482" width="240" height="10" fill="#7C3AED"/>
  <text x="150" y="481" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«middleware»</text>
  <text x="150" y="504" text-anchor="middle" fill="#4C1D95" font-size="12" font-weight="bold">AuthMiddleware</text>
  <line x1="30" y1="515" x2="270" y2="515" stroke="#C4B5FD" stroke-width="1"/>
  <text x="40" y="532" fill="#374151" font-size="11">+ authenticate(req, res, next)</text>
  <text x="40" y="550" fill="#374151" font-size="11">+ requireRole(...roles)</text>
  <text x="40" y="568" fill="#374151" font-size="11">- verifyToken(token): Payload</text>
  <text x="40" y="586" fill="#374151" font-size="11">req.user = {id, role, email}</text>

  <!-- ══ ExamController ══════════════════════════════════ -->
  <rect x="430" y="60" width="260" height="256" rx="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="430" y="60" width="260" height="32" rx="8" fill="#E11D48"/>
  <rect x="430" y="82" width="260" height="10" fill="#E11D48"/>
  <text x="560" y="81" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«controller»</text>
  <text x="560" y="104" text-anchor="middle" fill="#9F1239" font-size="12" font-weight="bold">ExamController</text>
  <line x1="430" y1="115" x2="690" y2="115" stroke="#FECDD3" stroke-width="1"/>
  <text x="440" y="132" fill="#374151" font-size="11">+ createExam(req, res): void</text>
  <text x="440" y="150" fill="#374151" font-size="11">+ getTeacherExams(req, res): void</text>
  <text x="440" y="168" fill="#374151" font-size="11">+ toggleExam(req, res): void</text>
  <text x="440" y="186" fill="#374151" font-size="11">+ deleteExam(req, res): void</text>
  <text x="440" y="204" fill="#374151" font-size="11">+ getStudentExams(req, res): void</text>
  <text x="440" y="222" fill="#374151" font-size="11">+ getExamAttempt(req, res): void</text>
  <text x="440" y="240" fill="#374151" font-size="11">+ submitExam(req, res): void</text>
  <text x="440" y="258" fill="#374151" font-size="11">+ getStudentsList(req, res): void</text>
  <text x="440" y="278" fill="#9F1239" font-size="11">- autoEvaluate(answers, qList)</text>
  <text x="440" y="296" fill="#9F1239" font-size="11">- assignGrade(percentage)</text>

  <!-- ══ ResultController ══════════════════════════════════ -->
  <rect x="430" y="360" width="260" height="196" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="430" y="360" width="260" height="32" rx="8" fill="#16A34A"/>
  <rect x="430" y="382" width="260" height="10" fill="#16A34A"/>
  <text x="560" y="381" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«controller»</text>
  <text x="560" y="404" text-anchor="middle" fill="#14532D" font-size="12" font-weight="bold">ResultController</text>
  <line x1="430" y1="415" x2="690" y2="415" stroke="#86EFAC" stroke-width="1"/>
  <text x="440" y="432" fill="#374151" font-size="11">+ getStudentResult(req, res)</text>
  <text x="440" y="450" fill="#374151" font-size="11">+ getAllStudentResults(req, res)</text>
  <text x="440" y="468" fill="#374151" font-size="11">+ getExamResults(req, res)</text>
  <text x="440" y="486" fill="#374151" font-size="11">+ getTeacherSummary(req, res)</text>
  <text x="440" y="504" fill="#374151" font-size="11">+ getStudentSummary(req, res)</text>
  <text x="440" y="522" fill="#374151" font-size="11">- calcStats(results[]): object</text>
  <text x="440" y="540" fill="#374151" font-size="11">- formatGrade(pct): string</text>

  <!-- ══ DatabasePool ══════════════════════════════════════ -->
  <rect x="800" y="200" width="270" height="156" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <rect x="800" y="200" width="270" height="32" rx="8" fill="#475569"/>
  <rect x="800" y="222" width="270" height="10" fill="#475569"/>
  <text x="935" y="221" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«singleton»</text>
  <text x="935" y="244" text-anchor="middle" fill="#1E293B" font-size="12" font-weight="bold">DatabasePool</text>
  <line x1="800" y1="255" x2="1070" y2="255" stroke="#CBD5E1" stroke-width="1"/>
  <text x="810" y="272" fill="#374151" font-size="11">- pool: mysql2.Pool</text>
  <text x="810" y="290" fill="#374151" font-size="11">- connectionLimit: 10</text>
  <line x1="800" y1="300" x2="1070" y2="300" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="810" y="317" fill="#374151" font-size="11">+ query(sql, params): Promise</text>
  <text x="810" y="335" fill="#374151" font-size="11">+ getConnection(): Promise</text>

  <!-- ══ ExpressApp ══════════════════════════════════════ -->
  <rect x="800" y="60" width="270" height="116" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <rect x="800" y="60" width="270" height="32" rx="8" fill="#059669"/>
  <rect x="800" y="82" width="270" height="10" fill="#059669"/>
  <text x="935" y="81" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«entry point»</text>
  <text x="935" y="104" text-anchor="middle" fill="#064E3B" font-size="12" font-weight="bold">ExpressApp (server.js)</text>
  <line x1="800" y1="115" x2="1070" y2="115" stroke="#6EE7B7" stroke-width="1"/>
  <text x="810" y="132" fill="#374151" font-size="11">+ listen(PORT): void</text>
  <text x="810" y="150" fill="#374151" font-size="11">+ use(middleware): void</text>
  <text x="810" y="168" fill="#374151" font-size="11">+ static(path): void</text>

  <!-- ══ Frontend Modules ══════════════════════════════════════ -->
  <rect x="800" y="400" width="270" height="196" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="800" y="400" width="270" height="32" rx="8" fill="#F59E0B"/>
  <rect x="800" y="422" width="270" height="10" fill="#F59E0B"/>
  <text x="935" y="421" text-anchor="middle" fill="white" font-size="13" font-weight="bold">«frontend»</text>
  <text x="935" y="444" text-anchor="middle" fill="#78350F" font-size="12" font-weight="bold">JS Utils (utils.js)</text>
  <line x1="800" y1="455" x2="1070" y2="455" stroke="#FCD34D" stroke-width="1"/>
  <text x="810" y="472" fill="#374151" font-size="11">Auth.setSession(token, user)</text>
  <text x="810" y="490" fill="#374151" font-size="11">Auth.getUser(): User</text>
  <text x="810" y="508" fill="#374151" font-size="11">Auth.requireAuth(role)</text>
  <text x="810" y="526" fill="#374151" font-size="11">API.get/post/put/delete()</text>
  <text x="810" y="544" fill="#374151" font-size="11">showAlert / setLoading()</text>
  <text x="810" y="562" fill="#374151" font-size="11">formatDate / getInitials()</text>
  <text x="810" y="580" fill="#374151" font-size="11">openModal / closeModal()</text>

  <!-- ══ RELATIONSHIP LINES ══════════════════════════════════════ -->
  <!-- AuthMiddleware → ExamController (uses) -->
  <line x1="270" y1="528" x2="430" y2="280" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="320" y="450" fill="#7C3AED" font-size="10">«guards»</text>

  <!-- ExamController → DatabasePool (uses) -->
  <line x1="690" y1="200" x2="800" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="728" y="232" fill="#475569" font-size="10">«uses»</text>

  <!-- ResultController → DatabasePool (uses) -->
  <line x1="690" y1="460" x2="800" y2="330" stroke="#475569" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- AuthController → DatabasePool (uses) -->
  <line x1="270" y1="140" x2="800" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ExpressApp → controllers (registers) -->
  <line x1="800" y1="120" x2="690" y2="120" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="720" y="112" fill="#059669" font-size="10">«registers»</text>
  <line x1="800" y1="120" x2="270" y2="120" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="800" y1="120" x2="270" y2="310" stroke="#059669" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ExpressApp → DatabasePool (creates) -->
  <line x1="935" y1="176" x2="935" y2="200" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="940" y="192" fill="#059669" font-size="10">creates</text>

  <!-- Legend -->
  <rect x="30" y="650" width="360" height="110" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="210" y="672" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Legend</text>
  <line x1="50" y1="690" x2="90" y2="690" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="98" y="694" font-size="11" fill="#374151">Dependency (uses / calls)</text>
  <line x1="50" y1="710" x2="90" y2="710" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#open)"/>
  <text x="98" y="714" font-size="11" fill="#374151">Guards / Protects route</text>
  <text x="50" y="735" font-size="11" fill="#374151">«controller» — Route handler module (Node.js/Express)</text>
  <text x="50" y="752" font-size="11" fill="#374151">«singleton» — Single shared instance (db pool)</text>
</svg>
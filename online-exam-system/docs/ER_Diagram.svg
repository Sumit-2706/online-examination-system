<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="820" viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#F8FAFC" rx="12"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1E3A5F">Online Examination System — Entity Relationship Diagram</text>

  <!-- ── TEACHERS ─────────────────────────────────────────────── -->
  <rect x="30" y="60" width="200" height="200" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="30" y="60" width="200" height="36" rx="10" fill="#2563EB"/>
  <rect x="30" y="86" width="200" height="10" fill="#2563EB"/>
  <text x="130" y="83" text-anchor="middle" fill="white" font-size="13" font-weight="bold">teachers</text>
  <text x="45" y="115" fill="#1E3A5F" font-size="11">🔑 id (PK, INT)</text>
  <text x="45" y="133" fill="#374151" font-size="11">  name VARCHAR(100)</text>
  <text x="45" y="151" fill="#374151" font-size="11">  email VARCHAR(150) UNIQUE</text>
  <text x="45" y="169" fill="#374151" font-size="11">  password VARCHAR(255)</text>
  <text x="45" y="187" fill="#374151" font-size="11">  subject VARCHAR(100)</text>
  <text x="45" y="205" fill="#374151" font-size="11">  created_at TIMESTAMP</text>

  <!-- ── STUDENTS ─────────────────────────────────────────────── -->
  <rect x="860" y="60" width="210" height="220" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="860" y="60" width="210" height="36" rx="10" fill="#16A34A"/>
  <rect x="860" y="86" width="210" height="10" fill="#16A34A"/>
  <text x="965" y="83" text-anchor="middle" fill="white" font-size="13" font-weight="bold">students</text>
  <text x="875" y="115" fill="#14532D" font-size="11">🔑 id (PK, INT)</text>
  <text x="875" y="133" fill="#374151" font-size="11">  name VARCHAR(100)</text>
  <text x="875" y="151" fill="#374151" font-size="11">  email VARCHAR(150) UNIQUE</text>
  <text x="875" y="169" fill="#374151" font-size="11">  password VARCHAR(255)</text>
  <text x="875" y="187" fill="#374151" font-size="11">  roll_number VARCHAR(50) UQ</text>
  <text x="875" y="205" fill="#374151" font-size="11">  department VARCHAR(100)</text>
  <text x="875" y="223" fill="#374151" font-size="11">  created_at TIMESTAMP</text>

  <!-- ── QUESTIONS ─────────────────────────────────────────────── -->
  <rect x="30" y="320" width="220" height="260" rx="10" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <rect x="30" y="320" width="220" height="36" rx="10" fill="#D97706"/>
  <rect x="30" y="346" width="220" height="10" fill="#D97706"/>
  <text x="140" y="343" text-anchor="middle" fill="white" font-size="13" font-weight="bold">questions</text>
  <text x="45" y="375" fill="#92400E" font-size="11">🔑 id (PK, INT)</text>
  <text x="45" y="393" fill="#374151" font-size="11">🔗 teacher_id (FK)</text>
  <text x="45" y="411" fill="#374151" font-size="11">  question_text TEXT</text>
  <text x="45" y="429" fill="#374151" font-size="11">  option_a VARCHAR(500)</text>
  <text x="45" y="447" fill="#374151" font-size="11">  option_b VARCHAR(500)</text>
  <text x="45" y="465" fill="#374151" font-size="11">  option_c VARCHAR(500)</text>
  <text x="45" y="483" fill="#374151" font-size="11">  option_d VARCHAR(500)</text>
  <text x="45" y="501" fill="#374151" font-size="11">  correct_answer ENUM</text>
  <text x="45" y="519" fill="#374151" font-size="11">  subject, difficulty, marks</text>

  <!-- ── EXAMS ─────────────────────────────────────────────── -->
  <rect x="420" y="60" width="220" height="260" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="420" y="60" width="220" height="36" rx="10" fill="#7C3AED"/>
  <rect x="420" y="86" width="220" height="10" fill="#7C3AED"/>
  <text x="530" y="83" text-anchor="middle" fill="white" font-size="13" font-weight="bold">exams</text>
  <text x="435" y="115" fill="#4C1D95" font-size="11">🔑 id (PK, INT)</text>
  <text x="435" y="133" fill="#374151" font-size="11">🔗 teacher_id (FK → teachers)</text>
  <text x="435" y="151" fill="#374151" font-size="11">  title VARCHAR(200)</text>
  <text x="435" y="169" fill="#374151" font-size="11">  subject VARCHAR(100)</text>
  <text x="435" y="187" fill="#374151" font-size="11">  description TEXT</text>
  <text x="435" y="205" fill="#374151" font-size="11">  duration_mins INT</text>
  <text x="435" y="223" fill="#374151" font-size="11">  total_marks INT</text>
  <text x="435" y="241" fill="#374151" font-size="11">  scheduled_at DATETIME</text>
  <text x="435" y="259" fill="#374151" font-size="11">  is_active BOOLEAN</text>
  <text x="435" y="277" fill="#374151" font-size="11">  created_at TIMESTAMP</text>

  <!-- ── EXAM_QUESTIONS ─────────────────────────────────────────────── -->
  <rect x="290" y="360" width="200" height="110" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="290" y="360" width="200" height="36" rx="10" fill="#CA8A04"/>
  <rect x="290" y="386" width="200" height="10" fill="#CA8A04"/>
  <text x="390" y="383" text-anchor="middle" fill="white" font-size="12" font-weight="bold">exam_questions</text>
  <text x="305" y="415" fill="#374151" font-size="11">🔑 id (PK, INT)</text>
  <text x="305" y="433" fill="#374151" font-size="11">🔗 exam_id (FK → exams)</text>
  <text x="305" y="451" fill="#374151" font-size="11">🔗 question_id (FK → qs)</text>

  <!-- ── EXAM_ENROLLMENTS ─────────────────────────────────────────────── -->
  <rect x="610" y="360" width="210" height="110" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="610" y="360" width="210" height="36" rx="10" fill="#CA8A04"/>
  <rect x="610" y="386" width="210" height="10" fill="#CA8A04"/>
  <text x="715" y="383" text-anchor="middle" fill="white" font-size="12" font-weight="bold">exam_enrollments</text>
  <text x="625" y="415" fill="#374151" font-size="11">🔑 id (PK, INT)</text>
  <text x="625" y="433" fill="#374151" font-size="11">🔗 exam_id (FK → exams)</text>
  <text x="625" y="451" fill="#374151" font-size="11">🔗 student_id (FK → students)</text>

  <!-- ── RESULTS ─────────────────────────────────────────────── -->
  <rect x="420" y="560" width="220" height="200" rx="10" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="420" y="560" width="220" height="36" rx="10" fill="#E11D48"/>
  <rect x="420" y="586" width="220" height="10" fill="#E11D48"/>
  <text x="530" y="583" text-anchor="middle" fill="white" font-size="13" font-weight="bold">results</text>
  <text x="435" y="615" fill="#9F1239" font-size="11">🔑 id (PK, INT)</text>
  <text x="435" y="633" fill="#374151" font-size="11">🔗 exam_id (FK → exams)</text>
  <text x="435" y="651" fill="#374151" font-size="11">🔗 student_id (FK → students)</text>
  <text x="435" y="669" fill="#374151" font-size="11">  score INT</text>
  <text x="435" y="687" fill="#374151" font-size="11">  total_marks INT</text>
  <text x="435" y="705" fill="#374151" font-size="11">  percentage DECIMAL(5,2)</text>
  <text x="435" y="723" fill="#374151" font-size="11">  grade VARCHAR(5)</text>
  <text x="435" y="741" fill="#374151" font-size="11">  submitted_at TIMESTAMP</text>

  <!-- ── STUDENT_ANSWERS ─────────────────────────────────────────────── -->
  <rect x="680" y="580" width="220" height="160" rx="10" fill="#FDF2F8" stroke="#C026D3" stroke-width="1.5"/>
  <rect x="680" y="580" width="220" height="36" rx="10" fill="#C026D3"/>
  <rect x="680" y="606" width="220" height="10" fill="#C026D3"/>
  <text x="790" y="603" text-anchor="middle" fill="white" font-size="12" font-weight="bold">student_answers</text>
  <text x="695" y="635" fill="#701A75" font-size="11">🔑 id (PK, INT)</text>
  <text x="695" y="653" fill="#374151" font-size="11">🔗 result_id (FK → results)</text>
  <text x="695" y="671" fill="#374151" font-size="11">🔗 question_id (FK → questions)</text>
  <text x="695" y="689" fill="#374151" font-size="11">  chosen_answer ENUM</text>
  <text x="695" y="707" fill="#374151" font-size="11">  is_correct BOOLEAN</text>

  <!-- ── RELATIONSHIP LINES ─────────────────────────────────────────────── -->
  <!-- teachers → questions (1:M) -->
  <line x1="130" y1="260" x2="130" y2="320" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135" y="295" fill="#D97706" font-size="10" font-weight="bold">1:M</text>

  <!-- teachers → exams (1:M) -->
  <line x1="230" y1="160" x2="420" y2="160" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="152" fill="#7C3AED" font-size="10" font-weight="bold">1:M</text>

  <!-- exams → exam_questions (1:M) -->
  <line x1="490" y1="320" x2="440" y2="360" stroke="#CA8A04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="348" fill="#CA8A04" font-size="10" font-weight="bold">1:M</text>

  <!-- exam_questions → questions (M:1) -->
  <line x1="290" y1="415" x2="250" y2="415" stroke="#CA8A04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="408" fill="#CA8A04" font-size="10" font-weight="bold">M:1</text>

  <!-- exams → exam_enrollments (1:M) -->
  <line x1="570" y1="320" x2="660" y2="360" stroke="#CA8A04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="348" fill="#CA8A04" font-size="10" font-weight="bold">1:M</text>

  <!-- exam_enrollments → students (M:1) -->
  <line x1="820" y1="415" x2="870" y2="250" stroke="#CA8A04" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="840" y="340" fill="#CA8A04" font-size="10" font-weight="bold">M:1</text>

  <!-- exams → results (1:M) -->
  <line x1="530" y1="320" x2="530" y2="560" stroke="#E11D48" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="536" y="448" fill="#E11D48" font-size="10" font-weight="bold">1:M</text>

  <!-- students → results (1:M) -->
  <line x1="860" y1="280" x2="650" y2="670" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="775" y="480" fill="#E11D48" font-size="10" font-weight="bold">1:M</text>

  <!-- results → student_answers (1:M) -->
  <line x1="640" y1="670" x2="680" y2="670" stroke="#C026D3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="648" y="663" fill="#C026D3" font-size="10" font-weight="bold">1:M</text>

  <!-- questions → student_answers (1:M) -->
  <line x1="200" y1="430" x2="695" y2="671" stroke="#C026D3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="640" width="240" height="130" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="150" y="663" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Legend</text>
  <line x1="50" y1="680" x2="90" y2="680" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="98" y="684" font-size="11" fill="#374151">Relationship (FK)</text>
  <line x1="50" y1="700" x2="90" y2="700" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="98" y="704" font-size="11" fill="#374151">Junction Table</text>
  <rect x="50" y="716" width="12" height="12" rx="2" fill="#FEF9C3" stroke="#CA8A04" stroke-dasharray="3,2"/>
  <text x="68" y="727" font-size="11" fill="#374151">Junction / Bridge Table</text>
  <text x="50" y="752" font-size="10" fill="#888">🔑 Primary Key    🔗 Foreign Key</text>
</svg>
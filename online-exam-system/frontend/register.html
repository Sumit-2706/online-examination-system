<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — ExamPortal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:500px;">

    <div class="auth-logo">
      <div class="logo-icon">📝</div>
      <h1>Student Registration</h1>
      <p>Create your ExamPortal account</p>
    </div>

    <div id="alertBox" class="hidden"></div>
    <div id="successBox" class="hidden"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="roll_number">Roll Number *</label>
          <input type="text" id="roll_number" placeholder="CS2024001" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" placeholder="student@college.edu" required>
      </div>
      <div class="form-group">
        <label for="department">Department</label>
        <select id="department">
          <option value="">Select Department</option>
          <option>Computer Science</option>
          <option>Information Technology</option>
          <option>Electronics</option>
          <option>Mechanical Engineering</option>
          <option>Civil Engineering</option>
          <option>Mathematics</option>
          <option>Physics</option>
          <option>Commerce</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" placeholder="Repeat password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
    </form>

    <p class="text-center text-sm mt-2">
      Already have an account? <a href="index.html">Login here</a>
    </p>
  </div>
</div>

<script src="js/utils.js"></script>
<script>
  async function handleRegister(e) {
    e.preventDefault();
    clearAlert('alertBox');

    const name             = document.getElementById('name').value.trim();
    const email            = document.getElementById('email').value.trim();
    const password         = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const roll_number      = document.getElementById('roll_number').value.trim();
    const department       = document.getElementById('department').value;

    // Client-side validation
    if (password !== confirm_password) {
      return showAlert('alertBox', 'Passwords do not match.', 'error');
    }
    if (password.length < 6) {
      return showAlert('alertBox', 'Password must be at least 6 characters.', 'error');
    }

    const btn = document.getElementById('registerBtn');
    setLoading(btn, true);

    const { ok, data } = await API.post('/auth/student/register', {
      name, email, password, roll_number, department
    });

    setLoading(btn, false);

    if (ok) {
      document.getElementById('registerForm').reset();
      document.getElementById('successBox').innerHTML = `
        <div class="alert alert-success">
          ✅ Account created successfully! <a href="index.html">Login now →</a>
        </div>`;
      document.getElementById('successBox').classList.remove('hidden');
    } else {
      showAlert('alertBox', data.message || 'Registration failed. Please try again.', 'error');
    }
  }
</script>
</body>
</html>

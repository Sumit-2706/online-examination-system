<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — ExamPortal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🎓</div>
      <span>ExamPortal</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <button class="nav-item" onclick="window.location.href='student-dashboard.html'"><span class="icon">🏠</span>Dashboard</button>
      <button class="nav-item" onclick="window.location.href='student-dashboard.html'"><span class="icon">📋</span>My Exams</button>
      <button class="nav-item" onclick="window.location.href='student-dashboard.html'"><span class="icon">📊</span>My Results</button>
      <div class="nav-section">Account</div>
      <button class="nav-item active"><span class="icon">👤</span>My Profile</button>
      <button class="nav-item" onclick="logout()"><span class="icon">🚪</span>Logout</button>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-avatar">S</div>
      <div class="user-info">
        <div class="name" id="sidebar-name">Student</div>
        <div class="role" id="sidebar-role">Student</div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title"><h2>My Profile</h2><p>View your account information</p></div>
    </div>
    <div class="page-content" style="max-width:600px;">

      <!-- Profile Card -->
      <div class="card mb-2">
        <div class="card-body" style="display:flex;align-items:center;gap:1.25rem;padding:1.5rem;">
          <div style="width:72px;height:72px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.75rem;font-weight:700;flex-shrink:0;" id="profile-avatar">S</div>
          <div>
            <h3 id="profile-name">Loading...</h3>
            <p class="text-muted text-sm" id="profile-email"></p>
            <span class="badge badge-info mt-1">Student</span>
          </div>
        </div>
      </div>

      <!-- Details -->
      <div class="card mb-2">
        <div class="card-header"><h3>Account Details</h3></div>
        <div class="card-body">
          <table style="width:100%;border-collapse:collapse;">
            <tr>
              <td style="padding:.75rem 0;color:var(--gray-500);font-size:.875rem;width:40%;border-bottom:1px solid var(--gray-100);">Full Name</td>
              <td style="padding:.75rem 0;font-size:.875rem;font-weight:500;border-bottom:1px solid var(--gray-100);" id="det-name">—</td>
            </tr>
            <tr>
              <td style="padding:.75rem 0;color:var(--gray-500);font-size:.875rem;border-bottom:1px solid var(--gray-100);">Email Address</td>
              <td style="padding:.75rem 0;font-size:.875rem;font-weight:500;border-bottom:1px solid var(--gray-100);" id="det-email">—</td>
            </tr>
            <tr>
              <td style="padding:.75rem 0;color:var(--gray-500);font-size:.875rem;border-bottom:1px solid var(--gray-100);">Roll Number</td>
              <td style="padding:.75rem 0;font-size:.875rem;font-weight:500;border-bottom:1px solid var(--gray-100);" id="det-roll">—</td>
            </tr>
            <tr>
              <td style="padding:.75rem 0;color:var(--gray-500);font-size:.875rem;">Department</td>
              <td style="padding:.75rem 0;font-size:.875rem;font-weight:500;" id="det-dept">—</td>
            </tr>
          </table>
        </div>
      </div>

      <!-- Change Password -->
      <div class="card">
        <div class="card-header"><h3>Change Password</h3></div>
        <div class="card-body">
          <div id="pwd-alert" class="hidden"></div>
          <div class="form-group">
            <label>Current Password</label>
            <input type="password" id="current_pwd" placeholder="Enter current password">
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new_pwd" placeholder="Min 6 characters">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirm_pwd" placeholder="Repeat new password">
          </div>
          <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script>
const user = Auth.requireAuth('student');
renderSidebarUser();

// Populate profile
document.getElementById('profile-avatar').textContent = getInitials(user.name);
document.getElementById('profile-name').textContent   = user.name;
document.getElementById('profile-email').textContent  = user.email;
document.getElementById('det-name').textContent  = user.name;
document.getElementById('det-email').textContent = user.email;
document.getElementById('det-roll').textContent  = user.roll_number || '—';
document.getElementById('det-dept').textContent  = user.department || '—';

async function changePassword() {
  clearAlert('pwd-alert');
  const current = document.getElementById('current_pwd').value;
  const newpwd  = document.getElementById('new_pwd').value;
  const confirm = document.getElementById('confirm_pwd').value;

  if (!current || !newpwd || !confirm) return showAlert('pwd-alert', 'All fields are required.', 'error');
  if (newpwd.length < 6) return showAlert('pwd-alert', 'New password must be at least 6 characters.', 'error');
  if (newpwd !== confirm) return showAlert('pwd-alert', 'Passwords do not match.', 'error');

  // For a real app, POST to /api/auth/change-password
  // This is a placeholder showing the UI pattern
  showAlert('pwd-alert', 'Password change endpoint can be wired to POST /api/auth/change-password', 'info');
}
</script>
</body>
</html>
